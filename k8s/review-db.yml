apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: review-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-db
  template:
    metadata:
      labels:
        app: review-db
    spec:
      containers:
        - name: review-db
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_DATABASE
              value: reviewservice
          volumeMounts:
            - name: review-db-storage
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
      volumes:
        - name: review-db-storage
          persistentVolumeClaim:
            claimName: review-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: review-db
spec:
  selector:
    app: review-db
  ports:
    - port: 3306
      targetPort: 3306